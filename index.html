<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Beemote IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; font-family: 'Segoe UI', sans-serif; }
    html, body { height: 100%; overflow: hidden; background: #f9fafb; color: #111827; }

    #chat {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 16px;
      word-wrap: break-word;
      animation: fadeIn 0.25s ease;
    }

    .user {
      background-color: #2563eb;
      color: white;
      align-self: flex-end;
    }

    .bot {
      background-color: #e5e7eb;
      color: #111827;
      align-self: flex-start;
    }

    .overlay {
      text-align: center;
      font-style: italic;
      font-size: 0.9em;
      color: #6b7280;
      margin-top: 8px;
    }

    #form {
      display: flex;
      padding: 10px;
      border-top: 1px solid #d1d5db;
      background-color: white;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1em;
      outline: none;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      margin-left: 10px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <form id="form">
      <input type="text" id="input" placeholder="Digite sua mensagem..." autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.10.0';
    let generator = null;
    const fallback = "Desculpe, não consegui responder no momento.";

    const init = async () => {
      generator = await pipeline('text-generation', 'Xenova/distilgpt2');
    };

    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    const scrollBottom = () => messages.scrollTop = messages.scrollHeight;

    const addBubble = (text, sender = "bot") => {
      const div = document.createElement("div");
      div.className = `bubble ${sender}`;
      div.textContent = text;
      messages.appendChild(div);
      scrollBottom();
    };

    const addOverlay = () => {
      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.id = "typing";
      overlay.textContent = "Beemote está digitando...";
      messages.appendChild(overlay);
      scrollBottom();
    };

    const removeOverlay = () => {
      const el = document.getElementById("typing");
      if (el) el.remove();
    };

    const responder = async (prompt) => {
      addOverlay();
      try {
        const result = await Promise.race([
          generator(prompt, { max_new_tokens: 60 }),
          new Promise((_, reject) => setTimeout(() => reject(), 7000))
        ]);
        return result[0].generated_text;
      } catch {
        return fallback;
      } finally {
        removeOverlay();
      }
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const texto = input.value.trim();
      if (!texto) return;
      input.value = "";
      addBubble(texto, "user");

      const resposta = await responder(texto);
      addBubble(resposta, "bot");
    });

    window.addEventListener("DOMContentLoaded", () => {
      init();
      scrollBottom();
    });
  </script>
</body>
</html>
