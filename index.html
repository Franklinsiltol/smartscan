<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beemote IA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-paplfLaJm3MXpjRMX5eZoHoDbSxLG+4WlE4YQZ8zaxRac5UeyOkEl0+rQZuB+2eqIMRVmlS+q0YGyM1X2zjDiQ==" crossorigin="anonymous" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0b0c10;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1f2833;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #66fcf1;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg {
      padding: 0.75rem;
      border-radius: 1rem;
      max-width: 80%;
      animation: fadeIn 0.4s ease;
    }
    .user {
      align-self: flex-end;
      background: #45a29e;
    }
    .bot {
      align-self: flex-start;
      background: #1f2833;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px)}
      to {opacity: 1; transform: translateY(0)}
    }
    footer {
      padding: 0.5rem;
      background: #1f2833;
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: #66fcf1;
      color: #0b0c10;
      font-weight: bold;
      cursor: pointer;
    }
    #loadingBarContainer {
      height: 5px;
      background: #0b0c10;
    }
    #loadingBar {
      height: 5px;
      width: 0;
      background: #66fcf1;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <header>Beemote IA</header>
  <div id="loadingBarContainer"><div id="loadingBar"></div></div>
  <div id="chat"></div>
  <footer>
    <input type="text" id="userInput" placeholder="Digite sua mensagem..." />
    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
  </footer>  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.10.1'

    let chat = document.getElementById("chat");
    let input = document.getElementById("userInput");
    let loadingBar = document.getElementById("loadingBar");

    let model, running = false;
    async function loadModel() {
      loadingBar.style.width = '10%';
      model = await pipeline('text-generation', 'Xenova/phi-1_5');
      loadingBar.style.width = '100%';
      setTimeout(() => loadingBar.style.display = 'none', 500);
    }

    async function sendMessage() {
      if (input.value.trim() === '' || running) return;
      let userMsg = input.value.trim();
      input.value = '';
      appendMessage(userMsg, 'user');
      running = true;

      appendMessage('...', 'bot', true);
      const placeholder = chat.querySelector('.bot.typing');
      const response = await model(userMsg, { max_new_tokens: 100 });

      placeholder.textContent = response[0].generated_text.replace(userMsg, '').trim();
      placeholder.classList.remove('typing');
      chat.scrollTop = chat.scrollHeight;
      running = false;
    }

    function appendMessage(text, sender, typing = false) {
      const div = document.createElement('div');
      div.className = `msg ${sender}` + (typing ? ' typing' : '');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    loadModel();
  </script></body>
</html>
