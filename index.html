<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beemote IA</title>
  <style>
    :root {
      --primary: #FFA500;
      --bg: #121212;
      --text: #ffffff;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    #chat-container {
      max-width: 800px;
      margin: 0 auto;
    }
    #messages {
      height: 70vh;
      overflow-y: auto;
      padding: 10px;
    }
    .message {
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 80%;
    }
    .user {
      background: rgba(79, 195, 247, 0.2);
      margin-left: auto;
    }
    .bot {
      background: rgba(129, 199, 132, 0.2);
      margin-right: auto;
    }
    #input-area {
      display: flex;
      gap: 10px;
      padding: 10px;
    }
    #user-input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      background: #2a2a2a;
      color: var(--text);
    }
    #send-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    #loading {
      text-align: center;
      margin: 20px 0;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: var(--primary);
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <h1 style="text-align: center; color: var(--primary)">🐝 Beemote IA</h1>
    <div id="messages"></div>
    <div id="loading">
      <div class="spinner"></div>
      <p>Carregando modelo pequeno...</p>
    </div>
    <div id="input-area" style="display: none;">
      <input type="text" id="user-input" placeholder="Digite sua mensagem...">
      <button id="send-btn">Enviar</button>
    </div>
  </div>

  <script>
    // Mini LLM local - modelo muito simplificado
    class TinyLLM {
      constructor() {
        this.model = this.createModel();
        this.tokenizer = this.createTokenizer();
      }

      createModel() {
        // Um modelo neural mínimo (2 camadas, 16 neurônios)
        return {
          layers: [
            { weights: new Array(16).fill(0).map(() => Math.random() * 0.2 - 0.1) },
            { weights: new Array(16).fill(0).map(() => Math.random() * 0.2 - 0.1) }
          ],
          predict: function(input) {
            // Simulação simplista de uma rede neural
            let output = 0;
            for (let i = 0; i < input.length; i++) {
              output += input[i] * this.layers[0].weights[i % 16];
              output += input[i] * this.layers[1].weights[i % 16];
            }
            return output > 0.5 ? 1 : 0;
          }
        };
      }

      createTokenizer() {
        // Tokenizador básico
        return {
          encode: function(text) {
            const tokens = [];
            for (let i = 0; i < text.length; i++) {
              tokens.push(text.charCodeAt(i) / 255);
            }
            // Preenche com zeros até 16 valores
            while (tokens.length < 16) tokens.push(0);
            return tokens.slice(0, 16);
          }
        };
      }

      async generate(prompt) {
        // Simula processamento
        await new Promise(resolve => setTimeout(resolve, 500));
        
        const tokens = this.tokenizer.encode(prompt.toLowerCase());
        const prediction = this.model.predict(tokens);
        
        // Respostas baseadas na predição
        const responses = [
          "Entendi sua mensagem sobre " + prompt + ". Estou em modo simplificado.",
          "Interessante! Sobre " + prompt + ", posso dizer que é um tópico relevante.",
          "No meu modo básico, minha análise sobre " + prompt + " é limitada.",
          "Você mencionou " + prompt + ". Gostaria de saber mais sobre isso?",
          "Estou processando sua pergunta sobre " + prompt + "...",
          "Sobre " + prompt + ", posso oferecer algumas reflexões básicas."
        ];
        
        return responses[Math.floor(prediction * responses.length)];
      }
    }

    // Elementos da interface
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const loadingEl = document.getElementById('loading');
    const inputArea = document.getElementById('input-area');

    // Inicialização
    async function init() {
      try {
        // Cria e carrega o modelo pequeno
        const llm = new TinyLLM();
        
        // Mostra que está pronto
        loadingEl.style.display = 'none';
        inputArea.style.display = 'flex';
        addMessage('Olá! Eu sou a Beemote IA com um mini modelo local. Como posso ajudar?', 'bot');
        
        return llm;
      } catch (error) {
        console.error("Erro ao carregar o modelo:", error);
        addMessage("Erro ao carregar o modelo. Recarregue a página.", "error");
        return null;
      }
    }

    // Função para adicionar mensagens ao chat
    function addMessage(text, sender) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${sender}`;
      messageEl.textContent = text;
      messagesEl.appendChild(messageEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Envia mensagem
    async function sendMessage(llm) {
      const text = inputEl.value.trim();
      if (!text || !llm) return;
      
      addMessage(text, 'user');
      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      
      const response = await llm.generate(text);
      
      addMessage(response, 'bot');
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    // Inicializa o chat
    init().then(llm => {
      sendBtn.addEventListener('click', () => sendMessage(llm));
      inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage(llm);
      });
    });
  </script>
</body>
</html>
