<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>QR Party Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: white; color: black; }
    .button { margin: 10px; padding: 10px 20px; background: black; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .balance { font-size: 24px; margin: 20px; }
    .history { margin-top: 20px; text-align: left; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>

<h1>QR Party Wallet</h1>

<div class="balance">Saldo: R$ <span id="saldo">0,00</span></div>

<canvas id="qrcode"></canvas>

<div>
  <button class="button" id="sendBtn">Enviar</button>
  <button class="button" id="receiveBtn">Receber</button>
  <button class="button" id="historyBtn">Histórico</button>
</div>

<!-- Modal para escanear QR Code -->
<div id="scannerModal" class="modal">
  <div class="modal-content">
    <div id="reader" style="width: 300px; margin: auto;"></div>
    <button class="button" id="closeScanner">Fechar</button>
  </div>
</div>

<!-- Modal para histórico -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <h2>Histórico</h2>
    <div id="historyList"></div>
    <button class="button" id="closeHistory">Fechar</button>
  </div>
</div>

<script>
  const gun = Gun();
  let userId = localStorage.getItem('userId') || Math.random().toString(36).substr(2);
  let userName = localStorage.getItem('userName') || prompt('Seu nome:') || "Anônimo";

  localStorage.setItem('userId', userId);
  localStorage.setItem('userName', userName);

  const saldoElem = document.getElementById('saldo');
  const qrcodeCanvas = document.getElementById('qrcode');

  let saldo = 1000;

  gun.get(userId).get('data').once(data => {
    if (data) {
      saldo = data.saldo || 1000;
      updateSaldo();
    } else {
      gun.get(userId).get('data').put({ name: userName, saldo: saldo });
    }
  });

  function updateSaldo() {
    saldoElem.innerText = saldo.toFixed(2);
    QRCode.toCanvas(qrcodeCanvas, userId, function (error) {
      if (error) console.error(error);
    });
  }

  updateSaldo();

  document.getElementById('sendBtn').onclick = () => {
    openScanner('send');
  };

  document.getElementById('receiveBtn').onclick = () => {
    openScanner('receive');
  };

  let scanner;
  function openScanner(mode) {
    document.getElementById('scannerModal').style.display = 'flex';
    scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
      scanner.stop();
      document.getElementById('scannerModal').style.display = 'none';
      if (mode === 'send') sendMoney(decodedText);
      else receiveMoney(decodedText);
    });
  }

  function sendMoney(recipientId) {
    let amount = parseFloat(prompt('Valor para enviar (R$):'));
    if (isNaN(amount) || amount <= 0 || amount > saldo) {
      alert('Valor inválido.');
      return;
    }
    saldo -= amount;
    updateSaldo();
    gun.get(userId).get('history').set({ type: 'sent', to: recipientId, amount, date: new Date().toLocaleString() });
    gun.get(recipientId).get('history').set({ type: 'received', from: userId, amount, date: new Date().toLocaleString() });
    gun.get(userId).get('data').put({ saldo });
    alert(`Enviado R$ ${amount.toFixed(2)} para ${recipientId}!`);
  }

  function receiveMoney(senderId) {
    let amount = parseFloat(prompt('Valor para receber (R$):'));
    if (isNaN(amount) || amount <= 0) {
      alert('Valor inválido.');
      return;
    }
    saldo += amount;
    updateSaldo();
    gun.get(userId).get('history').set({ type: 'received', from: senderId, amount, date: new Date().toLocaleString() });
    gun.get(senderId).get('history').set({ type: 'sent', to: userId, amount, date: new Date().toLocaleString() });
    gun.get(userId).get('data').put({ saldo });
    alert(`Recebido R$ ${amount.toFixed(2)} de ${senderId}!`);
  }

  document.getElementById('closeScanner').onclick = () => {
    if (scanner) scanner.stop();
    document.getElementById('scannerModal').style.display = 'none';
  };

  document.getElementById('historyBtn').onclick = () => {
    document.getElementById('historyModal').style.display = 'flex';
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';

    gun.get(userId).get('history').map().once(item => {
      if (item) {
        let entry = document.createElement('div');
        if (item.type === 'sent') {
          entry.innerText = `Enviado R$ ${item.amount.toFixed(2)} para ${item.to} em ${item.date}`;
        } else {
          entry.innerText = `Recebido R$ ${item.amount.toFixed(2)} de ${item.from} em ${item.date}`;
        }
        historyList.appendChild(entry);
      }
    });
  };

  document.getElementById('closeHistory').onclick = () => {
    document.getElementById('historyModal').style.display = 'none';
  };
</script>

</body>
</html>
