<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Beemote IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; font-family: 'Segoe UI', sans-serif; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background: #f2f5fa;
      color: #333;
    }

    #chat { flex: 1; display: flex; flex-direction: column; height: 100%; }
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .bubble {
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 15px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
    }
    .user { background: #1d9bf0; color: white; align-self: flex-end; }
    .bot { background: #e2e8f0; color: #333; align-self: flex-start; }

    .typing-overlay {
      background: rgba(255, 255, 255, 0.8);
      position: absolute;
      bottom: 64px;
      left: 0;
      right: 0;
      text-align: center;
      padding: 8px;
      font-style: italic;
      font-size: 0.9em;
      display: none;
      pointer-events: none;
    }

    #form {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ccc;
    }
    #input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
      outline: none;
    }
    button {
      background: #1d9bf0;
      color: white;
      border: none;
      padding: 10px 16px;
      margin-left: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <div class="typing-overlay" id="overlay">Beemote está digitando...</div>
    <form id="form">
      <input type="text" id="input" placeholder="Pergunte algo..." autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.10.0';
    let generator = null;
    const fallback = "Desculpe, estou com dificuldades para responder agora.";

    const init = async () => {
      generator = await pipeline('text-generation', 'Xenova/distilgpt2');
    };

    const overlay = document.getElementById("overlay");
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    const scrollBottom = () => messages.scrollTop = messages.scrollHeight;

    const showOverlay = (text = "Beemote está digitando...") => {
      overlay.textContent = text;
      overlay.style.display = "block";
    };
    const hideOverlay = () => overlay.style.display = "none";

    const respond = async (text) => {
      try {
        showOverlay();
        const response = await Promise.race([
          generator(text, { max_new_tokens: 60 }),
          new Promise((_, reject) => setTimeout(() => reject("timeout"), 8000))
        ]);
        return response[0].generated_text;
      } catch {
        return fallback;
      } finally {
        hideOverlay();
      }
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;
      input.value = "";

      messages.innerHTML += `<div class="bubble user">${userText}</div>`;
      scrollBottom();

      const reply = await respond(userText);
      messages.innerHTML += `<div class="bubble bot">${reply}</div>`;
      scrollBottom();
    });

    window.addEventListener('DOMContentLoaded', init);
    window.addEventListener('resize', scrollBottom);
  </script>
</body>
</html>
