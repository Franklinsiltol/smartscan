<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beemote IA</title>
  <style>
    body {
      margin: 0; font-family: sans-serif; background: #111; color: white;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      background: #ffbb00; padding: 1rem; text-align: center;
      font-weight: bold; font-size: 1.2rem; color: #000;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .message {
      padding: 0.6rem 1rem; border-radius: 10px;
      max-width: 80%; word-wrap: break-word;
    }
    .user { align-self: flex-end; background: #444; }
    .bot { align-self: flex-start; background: #222; }
    footer {
      display: flex; padding: 0.5rem; background: #000;
    }
    input {
      flex: 1; padding: 0.7rem; border: none; border-radius: 5px;
      background: #222; color: white;
    }
    button {
      margin-left: 0.5rem; padding: 0.7rem 1rem; border: none;
      background: #ffbb00; color: #000; font-weight: bold; border-radius: 5px;
    }
    #loader-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; color: white; display: flex; align-items: center;
      justify-content: center; flex-direction: column; z-index: 10;
    }
    .progress-bar {
      width: 80%; background: #333; border-radius: 5px; overflow: hidden;
      margin-top: 1rem;
    }
    .progress-fill {
      height: 20px; background: #ffbb00; width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <header>Beemote IA</header>

  <div id="chat"></div>

  <footer>
    <input id="prompt" placeholder="Digite sua pergunta..." />
    <button onclick="send()">Enviar</button>
  </footer>

  <div id="loader-overlay">
    <div>Carregando Beemote IA...</div>
    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>
  </div>

  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.12.0";

    let generator;

    const progressBar = document.getElementById('progress');
    const loader = document.getElementById('loader-overlay');
    const chat = document.getElementById('chat');
    const promptInput = document.getElementById('prompt');

    // Load model with real progress bar
    pipeline('text-generation', 'Xenova/phi-2', {
      progress_callback: (progress) => {
        const p = Math.round(progress * 100);
        progressBar.style.width = p + '%';
      }
    }).then(pipe => {
      generator = pipe;
      loader.style.display = 'none';
      promptInput.focus();
    });

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const prompt = promptInput.value.trim();
      if (!prompt || !generator) return;

      appendMessage(prompt, 'user');
      promptInput.value = '';
      appendMessage('...', 'bot');

      const responses = await generator(prompt, {
        max_new_tokens: 100,
        temperature: 0.7,
        top_p: 0.9
      });

      const lastBot = [...chat.querySelectorAll('.bot')].pop();
      lastBot.textContent = responses[0].generated_text;
      chat.scrollTop = chat.scrollHeight;
    }

    promptInput.addEventListener("keydown", e => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
