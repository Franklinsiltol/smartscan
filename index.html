<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beemote IA</title>
  <style>
    :root {
      --primary: #FFA500;
      --error: #f44336;
      --success: #4CAF50;
      --bg: #121212;
      --text: #ffffff;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    #app {
      max-width: 800px;
      margin: 0 auto;
    }
    #loading {
      text-align: center;
      margin-top: 50px;
    }
    #chat {
      display: none;
    }
    .message {
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 80%;
    }
    .bot {
      background: rgba(129, 199, 132, 0.2);
      border: 1px solid rgba(129, 199, 132, 0.5);
      margin-right: auto;
    }
    .user {
      background: rgba(79, 195, 247, 0.2);
      border: 1px solid rgba(79, 195, 247, 0.5);
      margin-left: auto;
    }
    .error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid var(--error);
    }
    .status {
      color: #aaa;
      font-size: 0.9em;
      margin: 5px 0;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    #retry {
      background: var(--primary);
      color: white;
    }
    #lite {
      background: var(--success);
      color: white;
    }
    #send {
      background: var(--primary);
      color: white;
    }
    input {
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: var(--text);
      flex: 1;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: var(--primary);
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <h1>🐝 Beemote IA</h1>
      <p id="status">Inicializando sistema...</p>
      <div class="status" id="progress-text">Conectando...</div>
      <div class="spinner" id="spinner"></div>
      <div id="progress" style="width: 100%; height: 6px; background: #333; border-radius: 3px; margin: 15px 0; overflow: hidden;">
        <div id="progress-bar" style="height: 100%; width: 0%; background: var(--primary); transition: width 0.3s;"></div>
      </div>
      <button id="retry" style="display: none;">Tentar Novamente</button>
      <button id="lite" style="display: none;">Usar Versão Simulada</button>
    </div>

    <div id="chat">
      <div id="messages" style="height: 70vh; overflow-y: auto; padding: 10px;"></div>
      <div style="display: flex; gap: 10px; margin-top: 10px; padding: 10px;">
        <input type="text" id="input" placeholder="Digite sua mensagem..." disabled>
        <button id="send" disabled>Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // Verificação inicial do ambiente
    console.log("Iniciando Beemote IA...");
    if (!document.getElementById('app')) {
      console.error("Elemento #app não encontrado!");
      document.body.innerHTML = '<h1 style="color: white; text-align: center;">Erro: Estrutura do aplicativo não carregada</h1>';
    }

    // Implementação mínima do WebLLM como fallback
    class LocalChatModule {
      constructor() {
        console.log("Iniciando fallback local...");
        this.initProgressCallback = null;
      }
      
      setInitProgressCallback(cb) {
        this.initProgressCallback = cb;
      }
      
      async reload(model) {
        console.log("Carregando modelo local...");
        if (this.initProgressCallback) {
          const steps = [
            {progress: 0.1, text: "Iniciando fallback local"},
            {progress: 0.3, text: "Preparando modelo simples"},
            {progress: 0.6, text: "Carregando dados básicos"},
            {progress: 1.0, text: "Pronto para conversar"}
          ];
          
          for (const step of steps) {
            this.initProgressCallback(step);
            await new Promise(resolve => setTimeout(resolve, 300));
          }
        }
        return Promise.resolve();
      }
      
      async generate(prompt) {
        console.log("Gerando resposta para:", prompt);
        // Respostas pré-definidas para o modo fallback
        const responses = [
          `Entendi que você disse: "${prompt}". No modo básico, minhas respostas são limitadas.`,
          `Interessante: "${prompt}". Estou no modo simplificado agora.`,
          `Sobre "${prompt}": No momento estou com recursos reduzidos.`,
          `Você perguntou sobre "${prompt}". Recarregue a página para tentar o modo completo.`
        ];
        
        // Simula um tempo de processamento
        await new Promise(resolve => setTimeout(resolve, 800));
        
        return responses[Math.floor(Math.random() * responses.length)];
      }
    }

    // Configuração de fontes alternativas
    const LOAD_STRATEGIES = [
      {
        name: "CDN jsDelivr (direto)",
        action: async () => {
          console.log("Tentando carregar do jsDelivr...");
          try {
            const { ChatModule } = await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.1.12/+esm');
            return ChatModule;
          } catch (e) {
            console.warn("Falha ao carregar módulo ESM:", e);
            await loadScript("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.1.12/dist/web-llm.min.js");
            return window.ChatModule || (window.__web_llm__ && window.__web_llm__.ChatModule);
          }
        }
      },
      {
        name: "Fallback local",
        action: async () => {
          console.log("Usando implementação local...");
          return LocalChatModule;
        }
      }
    ];

    // Estado da aplicação
    let chat = null;
    let fallbackMode = false;
    let currentStrategyIndex = 0;

    // Elementos da UI
    const statusEl = document.getElementById('status');
    const progressTextEl = document.getElementById('progress-text');
    const progressBarEl = document.getElementById('progress-bar');
    const spinnerEl = document.getElementById('spinner');
    const retryBtn = document.getElementById('retry');
    const liteBtn = document.getElementById('lite');
    const loadingEl = document.getElementById('loading');
    const chatEl = document.getElementById('chat');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // Função para carregar scripts dinamicamente
    function loadScript(url) {
      console.log("Carregando script:", url);
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        
        script.onload = () => {
          console.log("Script carregado com sucesso:", url);
          resolve();
        };
        script.onerror = (err) => {
          console.error("Falha ao carregar script:", url, err);
          reject(err);
        };
        
        document.head.appendChild(script);
      });
    }

    // Função para adicionar mensagens ao chat
    function addMessage(text, type) {
      console.log("Adicionando mensagem:", type, text);
      try {
        const messageEl = document.createElement('div');
        messageEl.className = `message ${type}`;
        messageEl.textContent = text;
        messagesEl.appendChild(messageEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } catch (e) {
        console.error("Erro ao adicionar mensagem:", e);
      }
    }

    // Função para atualizar o status
    function updateStatus(message, isError = false) {
      console.log("Atualizando status:", message);
      try {
        statusEl.textContent = message;
        statusEl.style.color = isError ? 'var(--error)' : 'inherit';
      } catch (e) {
        console.error("Erro ao atualizar status:", e);
      }
    }

    // Função para tentar carregar o WebLLM
    async function tryLoadStrategy() {
      if (currentStrategyIndex >= LOAD_STRATEGIES.length) {
        throw new Error('Todas as estratégias falharam');
      }

      const strategy = LOAD_STRATEGIES[currentStrategyIndex];
      currentStrategyIndex++;

      updateStatus(`Tentando: ${strategy.name}`);
      progressTextEl.textContent = strategy.name;
      progressBarEl.style.width = `${(currentStrategyIndex / LOAD_STRATEGIES.length) * 100}%`;

      try {
        const ChatModule = await strategy.action();
        if (!ChatModule) throw new Error('Módulo não retornado');
        return ChatModule;
      } catch (error) {
        console.warn(`Falha na estratégia ${strategy.name}:`, error);
        return null;
      }
    }

    // Função para inicializar o chat
    async function initChat() {
      console.log("Iniciando chat...");
      updateStatus('Inicializando modelo de IA...');
      
      try {
        // Tenta todas as estratégias até encontrar uma que funcione
        let ChatModule = null;
        while (currentStrategyIndex < LOAD_STRATEGIES.length && !ChatModule) {
          ChatModule = await tryLoadStrategy();
        }

        if (!ChatModule) {
          throw new Error('Não foi possível carregar nenhuma versão do ChatModule');
        }

        chat = new ChatModule();
        
        // Configura o callback de progresso
        chat.setInitProgressCallback((report) => {
          updateStatus(report.text || 'Carregando modelo...');
          const percent = Math.round(report.progress * 100);
          progressBarEl.style.width = `${percent}%`;
          progressTextEl.textContent = `Progresso: ${percent}%`;
        });

        // Carrega o modelo (usando implementação local se necessário)
        await chat.reload('default');
        
        // Sucesso - mostra a interface do chat
        loadingEl.style.display = 'none';
        chatEl.style.display = 'block';
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        
        addMessage('Olá! Eu sou a Beemote IA. Como posso te ajudar hoje?', 'bot');
        
      } catch (error) {
        console.error('Erro na inicialização:', error);
        updateStatus('Erro ao carregar a IA completa', true);
        progressBarEl.style.background = 'var(--error)';
        spinnerEl.style.display = 'none';
        retryBtn.style.display = 'inline-block';
        liteBtn.style.display = 'inline-block';
      }
    }

    // Função para inicializar a versão simulada
    function initLiteVersion() {
      console.log("Iniciando versão simulada...");
      fallbackMode = true;
      updateStatus('Modo básico ativado');
      progressBarEl.style.width = '100%';
      progressBarEl.style.background = 'var(--success)';
      spinnerEl.style.display = 'none';
      
      loadingEl.style.display = 'none';
      chatEl.style.display = 'block';
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      
      addMessage('Você está usando a versão básica da Beemote IA. Algumas funcionalidades são limitadas.', 'bot');
    }

    // Configura os event listeners
    function setupEventListeners() {
      console.log("Configurando event listeners...");
      retryBtn.addEventListener('click', () => {
        console.log("Tentando novamente...");
        currentStrategyIndex = 0;
        spinnerEl.style.display = 'block';
        retryBtn.style.display = 'none';
        liteBtn.style.display = 'none';
        initChat();
      });

      liteBtn.addEventListener('click', () => {
        console.log("Iniciando versão simulada...");
        initLiteVersion();
      });

      sendBtn.addEventListener('click', async () => {
        const text = inputEl.value.trim();
        if (!text) return;
        
        addMessage(text, 'user');
        inputEl.value = '';
        inputEl.disabled = true;
        sendBtn.disabled = true;
        
        try {
          if (chat) {
            const reply = await chat.generate(text);
            addMessage(reply, 'bot');
          } else {
            addMessage('Desculpe, ocorreu um erro inesperado. Por favor, recarregue a página.', 'error');
          }
        } catch (error) {
          console.error("Erro ao gerar resposta:", error);
          addMessage('Ocorreu um erro ao gerar a resposta', 'error');
        } finally {
          inputEl.disabled = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      });

      // Enter key support
      inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendBtn.click();
        }
      });
    }

    // Inicia a aplicação
    console.log("Iniciando aplicação...");
    try {
      setupEventListeners();
      initChat();
    } catch (error) {
      console.error("Erro fatal na inicialização:", error);
      document.body.innerHTML = `
        <div style="color: white; text-align: center; padding: 20px;">
          <h1>Erro crítico no Beemote IA</h1>
          <p>O aplicativo encontrou um erro grave e não pode ser iniciado.</p>
          <p>Por favor, recarregue a página ou tente novamente mais tarde.</p>
          <button onclick="window.location.reload()" style="padding: 10px 20px; background: ${error}; color: white; border: none; border-radius: 5px; margin-top: 20px;">
            Recarregar Página
          </button>
        </div>
      `;
    }
  </script>
</body>
</html>
