<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beemote IA - TinyLlama Local</title>
  <style>
    :root {
      --primary: #FFA500;
      --bg: #121212;
      --text: #ffffff;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    #chat-container {
      max-width: 800px;
      margin: 0 auto;
    }
    #messages {
      height: 70vh;
      overflow-y: auto;
      padding: 10px;
    }
    .message {
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 80%;
    }
    .user {
      background: rgba(79, 195, 247, 0.2);
      margin-left: auto;
    }
    .bot {
      background: rgba(129, 199, 132, 0.2);
      margin-right: auto;
    }
    #input-area {
      display: flex;
      gap: 10px;
      padding: 10px;
    }
    #user-input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      background: #2a2a2a;
      color: var(--text);
    }
    #send-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    #status {
      text-align: center;
      margin: 20px 0;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <h1 style="text-align: center; color: var(--primary)">🐝 Beemote IA (TinyLlama)</h1>
    <div id="status">Carregando micromodelo (20MB)...</div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="user-input" placeholder="Digite sua mensagem..." disabled>
      <button id="send-btn" disabled>Enviar</button>
    </div>
  </div>

  <!-- Importamos o WebLLM diretamente do jsDelivr -->
  <script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.1.12/dist/web-llm.min.js"></script>
  
  <script>
    // Elementos da UI
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    // Instância do ChatModule
    let chat;

    // Função para adicionar mensagens
    function addMessage(text, sender) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${sender}`;
      messageEl.textContent = text;
      messagesEl.appendChild(messageEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Inicializa o modelo TinyLlama
    async function initModel() {
      try {
        statusEl.textContent = "Baixando modelo (pode demorar alguns minutos)...";
        
        chat = new webllm.ChatModule();
        
        // Configura o callback de progresso
        chat.setInitProgressCallback((report) => {
          statusEl.textContent = `${report.text} (${Math.round(report.progress * 100)}%)`;
        });

        // Carrega o TinyLlama (modelo pequeno)
        await chat.reload("TinyLlama-1.1B-Chat-v0.3-q4f16_1");
        
        statusEl.textContent = "Modelo pronto!";
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        
        addMessage("Olá! Sou a Beemote IA com TinyLlama (1.1B de parâmetros). Como posso ajudar?", "bot");
        
      } catch (error) {
        statusEl.textContent = "Erro ao carregar o modelo: " + error.message;
        addMessage("Erro ao carregar o modelo. Recarregue a página.", "error");
      }
    }

    // Envia mensagem
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      
      addMessage(text, "user");
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;
      
      try {
        const reply = await chat.generate(text);
        addMessage(reply, "bot");
      } catch (error) {
        addMessage("Erro ao gerar resposta: " + error.message, "error");
      }
      
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    // Event listeners
    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Inicia o modelo
    initModel();
  </script>
</body>
</html>
