<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Beemote IA - Chat inteligente otimizado para mobile">
  <title>Beemote IA</title>
  <style>
    :root {
      --bg-color: #121212;
      --primary-color: #FFA500;
      --primary-hover: #FF8C00;
      --user-color: #4FC3F7;
      --bot-color: #81C784;
      --input-bg: #1f1f1f;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --error-color: #f44336;
      --loading-color: #bbbbbb;
      --header-gradient: linear-gradient(135deg, #FFA500 0%, #FF8C00 100%);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      touch-action: manipulation;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    .chat-header {
      padding: 12px 20px;
      background: var(--header-gradient);
      color: white;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .chat-header::before {
      content: "🐝";
      margin-right: 8px;
      font-size: 1.2em;
    }

    .chat-log {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 85%;
      position: relative;
      animation: fadeIn 0.3s ease-out;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-size: 0.95em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background-color: rgba(79, 195, 247, 0.1);
      border: 1px solid var(--user-color);
      margin-left: auto;
      color: var(--user-color);
    }

    .message.bot {
      background-color: rgba(129, 199, 132, 0.1);
      border: 1px solid var(--bot-color);
      margin-right: auto;
      color: var(--bot-color);
    }

    .message.loading {
      color: var(--loading-color);
      font-style: italic;
    }

    .message.error {
      background-color: rgba(244, 67, 54, 0.1);
      border: 1px solid var(--error-color);
      color: var(--error-color);
    }

    .input-area {
      display: flex;
      padding: 12px;
      background: var(--input-bg);
      border-top: 1px solid #333;
      position: sticky;
      bottom: 0;
    }

    .input-area input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 16px; /* Evita zoom no iOS */
      background: #2a2a2a;
      color: var(--text-color);
      outline: none;
      -webkit-appearance: none;
    }

    .input-area button {
      margin-left: 8px;
      padding: 12px 18px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95em;
      min-width: 80px;
    }

    .status-bar {
      padding: 8px 12px;
      background: var(--card-bg);
      font-size: 0.75em;
      color: #aaa;
      text-align: center;
    }

    .typing-indicator span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--bot-color);
      border-radius: 50%;
      margin: 0 2px;
      animation: typingAnimation 1.4s infinite ease-in-out;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #progress-bar {
      width: 80%;
      max-width: 250px;
      height: 6px;
      background: #333;
      margin: 15px 0;
      border-radius: 3px;
      overflow: hidden;
    }

    #progress {
      height: 100%;
      background: var(--primary-color);
      width: 0%;
      transition: width 0.3s;
    }

    .model-selector select {
      padding: 8px 12px;
      border-radius: 20px;
      background: #2a2a2a;
      color: white;
      border: 1px solid #333;
      font-size: 16px; /* Evita zoom no iOS */
      margin: 5px 0;
    }

    .retry-button {
      padding: 8px 16px;
      background: var(--error-color);
      color: white;
      border: none;
      border-radius: 20px;
      margin-top: 10px;
    }

    #lite-version-btn {
      background: #4CAF50;
      margin-top: 15px;
    }

    @media (min-width: 600px) {
      .chat-header {
        font-size: 1.2em;
        padding: 15px 20px;
      }
      .message {
        max-width: 75%;
        padding: 12px 16px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div style="color:#FFA500; font-size:1.3em; margin-bottom:10px;">🐝 Beemote IA</div>
    <div id="loading-text">Inicializando inteligência artificial...</div>
    <div id="progress-bar"><div id="progress"></div></div>
    <div id="time-estimate" style="color:#aaa; font-size:0.8em;"></div>
    <button id="lite-version-btn" class="retry-button" style="display:none;">Usar Versão Lite</button>
  </div>

  <div class="chat-container" style="display:none;">
    <div class="chat-header">
      Beemote IA
    </div>
    <div class="model-selector">
      <select id="model-select">
        <option value="TinyLlama-1.1B-Chat-v0.3-q4f16_1">TinyLlama (Rápido)</option>
        <option value="phi-2-q4f16_1">Phi-2 (Padrão)</option>
      </select>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <div class="status-bar" id="status-bar">
      Preparando a Beemote IA...
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off" disabled />
      <button id="send-btn" disabled>Enviar</button>
    </div>
  </div>

  <script type="module">
    import { ChatModule } from 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.1.12';

    // Elementos da interface
    const chatLog = document.getElementById("chat-log");
    const input = document.getElementById("user-input");
    const button = document.getElementById("send-btn");
    const statusBar = document.getElementById("status-bar");
    const modelSelect = document.getElementById("model-select");
    const loadingScreen = document.getElementById("loading-screen");
    const loadingText = document.getElementById("loading-text");
    const progressBar = document.getElementById("progress");
    const timeEstimate = document.getElementById("time-estimate");
    const liteVersionBtn = document.getElementById("lite-version-btn");

    // Variáveis de estado
    let chat;
    let modelLoaded = false;
    let currentModel = "TinyLlama-1.1B-Chat-v0.3-q4f16_1";
    let initStartTime;
    let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // Configurações para mobile
    if (isMobile) {
      modelSelect.value = currentModel;
      liteVersionBtn.style.display = "block";
    }

    // Mostra tela de timeout
    let timeoutHandle = setTimeout(() => {
      if (!modelLoaded) {
        loadingText.innerHTML = "Está demorando mais que o normal...<br>Recomendamos usar a Versão Lite em dispositivos móveis";
        liteVersionBtn.style.display = "block";
      }
    }, 30000);

    // Versão Lite - Fallback
    liteVersionBtn.addEventListener("click", () => {
      loadingText.textContent = "Carregando versão simplificada...";
      startLiteVersion();
    });

    async function startLiteVersion() {
      try {
        // Esconde elementos do WebLLM
        modelSelect.style.display = "none";
        
        // Mostra chat UI
        document.querySelector(".chat-container").style.display = "flex";
        loadingScreen.style.display = "none";
        
        // Habilita interface
        input.disabled = false;
        button.disabled = false;
        modelLoaded = true;
        
        // Mensagem inicial
        addMessage("Você está usando a versão Lite da Beemote IA. Algumas funcionalidades podem ser limitadas.", "bot");
        updateStatus("Pronto - Modo Lite");
      } catch (error) {
        console.error("Erro na versão Lite:", error);
        loadingText.textContent = "Erro ao carregar a versão Lite. Por favor, recarregue a página.";
      }
    }

    // Inicialização do WebLLM
    async function initWebLLM() {
      try {
        initStartTime = Date.now();
        chat = new ChatModule();
        
        chat.setInitProgressCallback((report) => {
          const percent = Math.round(report.progress * 100);
          progressBar.style.width = `${percent}%`;
          
          // Estimativa de tempo
          const elapsed = (Date.now() - initStartTime) / 1000;
          const remaining = Math.round((elapsed / percent) * (100 - percent));
          
          loadingText.textContent = report.text || "Carregando modelo...";
          timeEstimate.textContent = `Tempo estimado: ${remaining}s`;
          
          // Atualiza status para o usuário
          if (percent < 30) {
            updateStatus("Baixando modelo...");
          } else if (percent < 80) {
            updateStatus("Compilando...");
          } else {
            updateStatus("Finalizando...");
          }
        });

        // Configurações otimizadas para mobile
        if (isMobile) {
          await chat.setInitConfig({
            wasmUrl: `https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.1.12/dist/${currentModel}-webgpu.wasm`
          });
        }

        await chat.reload(currentModel);
        
        // Sucesso - mostra interface
        clearTimeout(timeoutHandle);
        modelLoaded = true;
        document.querySelector(".chat-container").style.display = "flex";
        loadingScreen.style.display = "none";
        input.disabled = false;
        button.disabled = false;
        input.focus();
        
        // Mensagem inicial
        addMessage("Olá! Eu sou a Beemote IA 🐝. Como posso te ajudar hoje?", "bot");
        updateStatus("Pronto para conversar");
        
      } catch (error) {
        console.error("Erro na inicialização:", error);
        loadingText.innerHTML = `Erro ao carregar: ${error.message}<br>Tente a Versão Lite ou recarregue a página.`;
        liteVersionBtn.style.display = "block";
        updateStatus("Erro na inicialização");
      }
    }

    // Funções auxiliares
    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      
      if (sender === "loading") {
        div.innerHTML = `${text} <span class="typing-indicator"><span></span><span></span><span></span></span>`;
      } else {
        div.textContent = text;
      }
      
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function updateStatus(text) {
      statusBar.textContent = text;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || !modelLoaded) return;
      
      addMessage(text, "user");
      input.value = "";
      
      const loadingId = Date.now();
      addMessage("Pensando...", "loading");
      
      input.disabled = true;
      button.disabled = true;
      
      try {
        let reply;
        if (chat && modelLoaded) {
          // Modo completo com WebLLM
          reply = await chat.generate(text, () => {}, 0.7, isMobile ? 256 : 512);
        } else {
          // Modo Lite fallback
          reply = "Esta é uma resposta simulada (Modo Lite). Recarregue a página para tentar o modo completo novamente.";
        }
        
        document.querySelectorAll('.message.loading').forEach(el => el.remove());
        addMessage(reply, "bot");
      } catch (error) {
        console.error("Erro ao gerar resposta:", error);
        document.querySelectorAll('.message.loading').forEach(el => el.remove());
        addMessage(`Erro: ${error.message}`, "error");
      } finally {
        input.disabled = false;
        button.disabled = false;
        input.focus();
      }
    }

    // Event listeners
    button.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => e.key === "Enter" && sendMessage());
    
    modelSelect.addEventListener("change", async (e) => {
      if (!modelLoaded) return;
      currentModel = e.target.value;
      updateStatus(`Carregando ${currentModel}...`);
      await initWebLLM();
    });

    // Inicia automaticamente em desktop, mostra opções em mobile
    if (!isMobile) {
      initWebLLM();
    } else {
      loadingText.textContent = "Dispositivo móvel detectado. Carregando versão otimizada...";
      setTimeout(initWebLLM, 500);
    }
  </script>
</body>
</html>
