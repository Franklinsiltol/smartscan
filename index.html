<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beemote IA</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chat-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .message {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user-message {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .bot-message {
      align-self: flex-start;
      background: #e5e7eb;
      color: #111827;
    }
    #loading {
      display: none;
      text-align: center;
      padding: 10px;
      font-style: italic;
      color: #6b7280;
    }
    #chat-form {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px;
      background: #fff;
    }
    #user-input {
      flex: 1;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #user-input:focus {
      outline: none;
      border-color: #2563eb;
    }
    button {
      margin-left: 8px;
      padding: 10px 16px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="overlay">Carregando Beemote IA...</div>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="loading">Beemote está digitando...</div>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script type="module">
    import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm";

    const messagesDiv = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const loading = document.getElementById("loading");
    const overlay = document.getElementById("overlay");

    let engine;

    function addMessage(text, className) {
      const div = document.createElement("div");
      div.className = "message " + className;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function init() {
      overlay.style.display = "flex";
      engine = await webllm.CreateMLCEngine("Phi-2-q4f16_1-MLC");
      await engine.reload();
      overlay.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;

      addMessage(userText, "user-message");
      input.value = "";
      loading.style.display = "block";

      const reply = await engine.chat.completions.create({
        messages: [
          { role: "system", content: "Responda sempre em português do Brasil." },
          { role: "user", content: userText }
        ],
        stream: false
      });

      loading.style.display = "none";
      addMessage(reply.choices[0].message.content, "bot-message");
    });

    init();
  </script>
</body>
</html>
